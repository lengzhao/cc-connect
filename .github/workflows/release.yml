name: Personal Release

on:
  push:
    tags:
      - 'v10.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v10.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Required so git tag -l --format='%(contents)' can read annotated tag messages.
          fetch-tags: true

      - name: Set release version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildTime=${BUILD_TIME}"

          for target in \
            linux/amd64 \
            linux/arm64 \
            darwin/amd64 \
            darwin/arm64 \
            windows/amd64 \
            windows/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=""
            if [ "${GOOS}" = "windows" ]; then
              EXT=".exe"
            fi
            OUT="cc-connect-${VERSION}-${GOOS}-${GOARCH}${EXT}"
            echo "Building ${OUT}"
            GOOS="${GOOS}" GOARCH="${GOARCH}" CGO_ENABLED=0 \
              go build -ldflags "${LDFLAGS}" -o "dist/${OUT}" ./cmd/cc-connect
            if [ "${GOOS}" = "windows" ]; then
              (cd dist && zip "${OUT%.exe}.zip" "${OUT}")
            else
              tar -C dist -czf "dist/${OUT}.tar.gz" "${OUT}"
            fi
            rm "dist/${OUT}"
          done

      - name: Pack npm package
        env:
          NPM_VERSION: ${{ env.VERSION }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          NPM_VERSION="${NPM_VERSION#v}"
          node <<'EOF'
          const fs = require("fs");
          const pkgPath = "npm/package.json";
          const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
          pkg.version = process.env.NPM_VERSION;
          pkg.repository = {
            type: "git",
            url: `https://github.com/${process.env.GITHUB_REPOSITORY}.git`,
          };
          pkg.homepage = `https://github.com/${process.env.GITHUB_REPOSITORY}`;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          EOF
          cd npm
          npm pack --pack-destination ../dist
          cd ../dist
          sha256sum *.tar.gz *.zip *.tgz > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # checkout may not have the pushed tag annotation unless fetch-tags is enabled;
          # fetch explicitly as a fallback for tag-push events.
          git fetch --force origin "refs/tags/${VERSION}:refs/tags/${VERSION}" || true

          NOTES="$(git tag -l --format='%(contents)' "${VERSION}" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            OBJ_TYPE="$(git cat-file -t "refs/tags/${VERSION}" 2>/dev/null || true)"
            if [ "${OBJ_TYPE}" = "tag" ]; then
              NOTES="$(git cat-file tag "refs/tags/${VERSION}" | sed '1,/^$/d')"
            fi
          fi
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            printf 'Personal fork release %s.\n' "${VERSION}" > release-notes.md
          else
            printf '%s\n' "$NOTES" > release-notes.md
          fi
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" --notes-file release-notes.md
            gh release upload "${VERSION}" dist/*.tar.gz dist/*.zip dist/*.tgz dist/checksums.txt --clobber
          else
            gh release create "${VERSION}" dist/*.tar.gz dist/*.zip dist/*.tgz dist/checksums.txt \
              --title "${VERSION}" \
              --notes-file release-notes.md
          fi
