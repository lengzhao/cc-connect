<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>chat-api debug · local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c1117;
      --bg-panel: #121a22;
      --bg-elev: #182230;
      --line: #243041;
      --text: #e6edf5;
      --muted: #8b9bb0;
      --accent: #2fd3c8;
      --accent-dim: #1a8f88;
      --warn: #f0a35a;
      --danger: #ef6b6b;
      --ok: #6bcf8e;
      --user: #c9d4e3;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --display: "Syne", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, #16323a 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #1a2438 0%, transparent 50%),
        var(--bg);
      letter-spacing: 0.01em;
    }

    .shell {
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      grid-template-rows: auto 1fr;
      height: 100%;
      gap: 0;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(12, 17, 23, 0.85);
      backdrop-filter: blur(8px);
    }
    header h1 {
      margin: 0;
      font-family: var(--display);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    header h1 span { color: var(--accent); }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 0 3px rgba(239, 107, 107, 0.15);
    }
    .dot.ok {
      background: var(--ok);
      box-shadow: 0 0 0 3px rgba(107, 207, 142, 0.15);
    }

    aside, main, .log-pane {
      min-height: 0;
      border-right: 1px solid var(--line);
    }
    .log-pane { border-right: none; border-left: 1px solid var(--line); }

    .panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg-panel);
    }
    .panel-hd {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-family: var(--display);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-bd { padding: 12px; overflow: auto; flex: 1; }

    label {
      display: block;
      margin: 10px 0 4px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    input, textarea, select, button {
      font-family: var(--mono);
      font-size: 12px;
    }
    input, textarea, select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 2px rgba(47, 211, 200, 0.12);
    }
    input[type="radio"], input[type="checkbox"] {
      width: auto;
      padding: 0;
      margin: 2px 0 0;
      flex: 0 0 auto;
      accent-color: var(--accent);
      box-shadow: none;
    }
    textarea { resize: vertical; min-height: 64px; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    button {
      border: 1px solid var(--line);
      background: var(--bg-elev);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .1s;
    }
    button:hover { border-color: var(--accent-dim); }
    button:active { transform: translateY(1px); }
    button.primary {
      background: linear-gradient(180deg, #2a9f96, #1f7f78);
      border-color: #2a9f96;
      color: #041413;
      font-weight: 600;
    }
    button.danger { color: var(--danger); border-color: #5a2c2c; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .conv-list { display: flex; flex-direction: column; gap: 6px; }
    .conv-item {
      text-align: left;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      width: 100%;
    }
    .conv-item.active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(47, 211, 200, 0.25);
    }
    .conv-item .name {
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv-item .meta {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .chat {
      display: grid;
      grid-template-rows: 1fr auto;
      height: 100%;
      background: transparent;
    }
    .messages {
      overflow: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .bubble {
      max-width: min(720px, 92%);
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: var(--bg-panel);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
    }
    .bubble.user {
      align-self: flex-end;
      background: #1a2736;
      border-color: #31455c;
      color: var(--user);
    }
    .bubble.assistant { align-self: flex-start; }
    .bubble.thinking {
      align-self: flex-start;
      color: var(--muted);
      border-style: dashed;
      background: transparent;
      font-size: 12px;
    }
    .bubble.tool {
      align-self: flex-start;
      color: var(--muted);
      border-color: #3a4a3a;
      background: #121a14;
      font-size: 12px;
    }
    .bubble.tool .tag { color: var(--ok); }
    .bubble.interaction {
      align-self: flex-start;
      border-color: #4a3a20;
      background: #1a1510;
      font-size: 12px;
    }
    .bubble.interaction .tag { color: var(--warn); }
    .bubble.interaction.done { opacity: 0.65; }
    .ix-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .ix-actions button {
      font-size: 11px;
      padding: 6px 10px;
    }
    .ix-actions button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .ix-free {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .ix-free input {
      flex: 1;
      min-width: 0;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(4, 8, 12, 0.72);
      backdrop-filter: blur(6px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: min(560px, 100%);
      max-height: min(80vh, 720px);
      overflow: auto;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      padding: 18px 20px 16px;
    }
    .modal .modal-hd {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .modal .modal-hd h2 {
      margin: 0;
      flex: 1;
    }
    .modal .modal-close {
      flex-shrink: 0;
      margin: 0;
      padding: 4px 10px;
      font-size: 12px;
    }
    .modal h2 {
      margin: 0 0 8px;
      font-family: var(--display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--warn);
    }
    .modal .modal-meta {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 12px;
    }
    .modal .modal-prompt {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      margin-bottom: 14px;
      max-height: 40vh;
      overflow: auto;
    }
    .modal .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .modal .modal-actions button.primary {
      background: linear-gradient(180deg, #2a9f96, #1f7f78);
      border-color: #2a9f96;
      color: #041413;
      font-weight: 600;
    }
    .modal .modal-actions button.danger {
      color: var(--danger);
      border-color: #5a2c2c;
    }
    .modal .ix-free { margin-top: 0; width: 100%; }

    .bubble.sys {
      align-self: center;
      color: var(--warn);
      background: #241a10;
      border-color: #4a3720;
      font-size: 12px;
    }
    .bubble .tag {
      display: inline-block;
      margin-bottom: 6px;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 14px 16px;
      background: rgba(18, 26, 34, 0.95);
      display: grid;
      gap: 10px;
    }
    .composer-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .composer-actions .left { display: flex; gap: 8px; align-items: center; color: var(--muted); }

    .log {
      height: 100%;
      overflow: auto;
      padding: 10px 12px;
      font-size: 11px;
      line-height: 1.45;
      background: #0a0e13;
      color: #9db0c5;
    }
    .log .ev { margin-bottom: 8px; }
    .log .ev .k { color: var(--accent); }
    .log .ev .err { color: var(--danger); }
    .log .ev .warn { color: var(--warn); }

    details.advanced {
      margin-top: 8px;
      border-top: 1px dashed var(--line);
      padding-top: 8px;
    }
    details.advanced summary {
      cursor: pointer;
      color: var(--muted);
      margin-bottom: 6px;
    }

    @media (max-width: 1100px) {
      .shell { grid-template-columns: 240px 1fr; }
      .log-pane { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>chat-api <span>debug</span></h1>
      <div class="status">
        <div id="healthDot" class="dot"></div>
        <span id="healthText">checking…</span>
        <span id="runMeta"></span>
      </div>
    </header>

    <aside class="panel">
      <div class="panel-hd">
        <span>Config</span>
        <button type="button" id="btnHealth" title="Ping list API">ping</button>
      </div>
      <div class="panel-bd">
        <label>Base URL</label>
        <input id="baseUrl" value="" placeholder="auto from this host" />
        <label>Bearer Token</label>
        <input id="token" value="local-chat-api-token" />
        <div class="row">
          <div>
            <label>User</label>
            <input id="userId" value="local_user" />
          </div>
          <div>
            <label>User Name</label>
            <input id="userName" value="Local Tester" />
          </div>
        </div>
        <label>Channel (optional)</label>
        <input id="channel" placeholder="team-alpha/backend" />

        <details class="advanced" open>
          <summary>AgentContext headers</summary>
          <div class="row">
            <div>
              <label>X-Language</label>
              <input id="lang" value="zh" />
            </div>
            <div>
              <label>X-Task-ID</label>
              <input id="taskId" value="ui-job-1" />
            </div>
          </div>
          <div class="row">
            <div>
              <label>X-Trace-ID</label>
              <input id="traceId" value="" />
            </div>
            <div>
              <label>X-Tenant-ID</label>
              <input id="tenantId" value="acme" />
            </div>
          </div>
        </details>

        <div class="btn-row">
          <button type="button" id="btnSave" class="primary">保存配置</button>
          <button type="button" id="btnNew">新会话</button>
        </div>

        <div class="panel-hd" style="margin:16px -12px 8px; border-top:1px solid var(--line);">
          <span>Conversations</span>
          <button type="button" id="btnRefresh">刷新</button>
        </div>
        <div id="convList" class="conv-list"></div>
        <div class="btn-row">
          <button type="button" id="btnRename">重命名</button>
          <button type="button" id="btnDelete" class="danger">删除</button>
        </div>
      </div>
    </aside>

    <main class="chat">
      <div id="messages" class="messages"></div>
      <div class="composer">
        <textarea id="query" rows="3" placeholder="输入消息… Enter 发送，Shift+Enter 换行"></textarea>
        <div class="composer-actions">
          <div class="left">
            <span id="convLabel">conversation: (new)</span>
          </div>
          <div class="btn-row" style="margin:0">
            <button type="button" id="btnCancel" disabled>取消当前 run</button>
            <button type="button" id="btnSend" class="primary">发送</button>
          </div>
        </div>
      </div>
    </main>

    <section class="panel log-pane">
      <div class="panel-hd">
        <span>SSE Log</span>
        <button type="button" id="btnClearLog">清空</button>
      </div>
      <div id="sseLog" class="log"></div>
    </section>
  </div>

  <div id="ixModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="ixModalTitle">
    <div class="modal">
      <div class="modal-hd">
        <h2 id="ixModalTitle">确认</h2>
        <button type="button" id="btnIxClose" class="modal-close" title="隐藏窗口，可用底部输入框发新消息">隐藏</button>
      </div>
      <div id="ixModalMeta" class="modal-meta"></div>
      <div id="ixModalPrompt" class="modal-prompt"></div>
      <div id="ixModalActions" class="modal-actions"></div>
    </div>
  </div>

  <script>
    const LS_KEY = "chat-api-debug-v1";
    const $ = (id) => document.getElementById(id);

    const state = {
      conversationId: null,
      runId: null,
      abort: null,
      sending: false,
      activeStreams: 0,
      activeInteractionId: null,
      interactionRunId: null,
    };

    const fields = ["baseUrl", "token", "userId", "userName", "channel", "lang", "taskId", "traceId", "tenantId"];

    function loadConfig() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return;
        const cfg = JSON.parse(raw);
        for (const k of fields) {
          if (cfg[k] != null) $(k).value = cfg[k];
        }
        if (cfg.conversationId) {
          state.conversationId = cfg.conversationId;
          setConvLabel();
        }
        if (cfg.activeRunId) {
          state.runId = cfg.activeRunId;
          setConvLabel();
        }
      } catch {}
    }

    function saveConfig() {
      const cfg = {};
      for (const k of fields) cfg[k] = $(k).value.trim();
      cfg.conversationId = state.conversationId;
      cfg.activeRunId = state.runId || null;
      localStorage.setItem(LS_KEY, JSON.stringify(cfg));
    }

    function setActiveRun(runId) {
      if (!runId) return;
      state.runId = runId;
      setConvLabel();
      saveConfig();
      $("btnCancel").disabled = false;
    }

    function clearActiveRun() {
      state.runId = null;
      state.interactionRunId = null;
      state.activeInteractionId = null;
      setConvLabel();
      saveConfig();
      $("btnCancel").disabled = true;
    }

    function apiBase() {
      const raw = $("baseUrl").value.trim();
      if (raw) return raw.replace(/\/$/, "");
      // Same-origin when served from /debug/
      return window.location.origin.replace(/\/$/, "") + (window.__CHAT_API_PATH__ || "/v1").replace(/\/$/, "");
    }

    function authHeaders(extra = {}) {
      const h = {
        Authorization: "Bearer " + $("token").value.trim(),
        ...extra,
      };
      const user = $("userId").value.trim();
      if (user) h["X-Chat-API-User"] = user;
      const name = $("userName").value.trim();
      if (name) h["X-Chat-API-User-Name"] = name;
      const channel = $("channel").value.trim();
      if (channel) h["X-Chat-API-Channel"] = channel;
      const lang = $("lang").value.trim();
      if (lang) h["X-Language"] = lang;
      const taskId = $("taskId").value.trim();
      if (taskId) h["X-Task-ID"] = taskId;
      const traceId = $("traceId").value.trim();
      if (traceId) h["X-Trace-ID"] = traceId;
      const tenantId = $("tenantId").value.trim();
      if (tenantId) h["X-Tenant-ID"] = tenantId;
      return h;
    }

    function setHealth(ok, text) {
      $("healthDot").classList.toggle("ok", !!ok);
      $("healthText").textContent = text;
    }

    function setConvLabel() {
      $("convLabel").textContent = "conversation: " + (state.conversationId || "(new)");
      $("runMeta").textContent = state.runId ? "run: " + state.runId : "";
    }

    function logSSE(kind, payload, cls = "") {
      const el = document.createElement("div");
      el.className = "ev";
      const data = typeof payload === "string" ? payload : JSON.stringify(payload, null, 0);
      el.innerHTML = `<span class="k${cls ? " " + cls : ""}">${kind}</span> ${escapeHtml(data)}`;
      $("sseLog").appendChild(el);
      $("sseLog").scrollTop = $("sseLog").scrollHeight;
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function addBubble(role, text, tag) {
      const el = document.createElement("div");
      el.className = "bubble " + role;
      if (tag) {
        const t = document.createElement("div");
        t.className = "tag";
        t.textContent = tag;
        el.appendChild(t);
      }
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = text;
      el.appendChild(body);
      $("messages").appendChild(el);
      $("messages").scrollTop = $("messages").scrollHeight;
      return { el, body };
    }

    async function ping() {
      try {
        const user = encodeURIComponent($("userId").value.trim());
        const res = await fetch(`${apiBase()}/conversations?limit=1&user=${user}`, {
          headers: authHeaders(),
        });
        if (!res.ok) {
          setHealth(false, `HTTP ${res.status}`);
          return false;
        }
        setHealth(true, "online · " + apiBase());
        return true;
      } catch (e) {
        setHealth(false, "offline · " + e.message);
        return false;
      }
    }

    async function refreshConversations() {
      const user = encodeURIComponent($("userId").value.trim());
      const res = await fetch(`${apiBase()}/conversations?limit=50&user=${user}`, {
        headers: authHeaders(),
      });
      const json = await res.json();
      if (!res.ok || !json.ok) {
        addBubble("sys", "list conversations failed: " + JSON.stringify(json));
        return;
      }
      const list = $("convList");
      list.innerHTML = "";
      for (const c of json.data.conversations || []) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "conv-item" + (c.id === state.conversationId ? " active" : "");
        btn.innerHTML = `<div class="name">${escapeHtml(c.name || c.id)}</div>
          <div class="meta">${escapeHtml(c.id)}<br/>${escapeHtml((c.last_message_preview || "").slice(0, 80))}</div>`;
        btn.addEventListener("click", () => openConversation(c.id));
        list.appendChild(btn);
      }
    }

    async function openConversation(id) {
      state.conversationId = id;
      setConvLabel();
      saveConfig();
      $("messages").innerHTML = "";
      await refreshConversations();
      const res = await fetch(`${apiBase()}/conversations/${encodeURIComponent(id)}/messages?limit=50`, {
        headers: authHeaders(),
      });
      const json = await res.json();
      if (!res.ok || !json.ok) {
        addBubble("sys", "load history failed: " + JSON.stringify(json));
        return;
      }
      const msgs = (json.data.messages || []).slice().reverse();
      for (const m of msgs) {
        if (m.query) addBubble("user", m.query, m.user_name || m.user_id || "user");
        if (m.answer) addBubble("assistant", m.answer, "assistant");
      }
    }

    function newConversation() {
      state.conversationId = null;
      clearActiveRun();
      setConvLabel();
      $("messages").innerHTML = "";
      saveConfig();
      refreshConversations();
    }

    async function renameConversation() {
      if (!state.conversationId) return alert("先选中或创建会话");
      const name = prompt("新名称", "renamed");
      if (!name) return;
      const res = await fetch(`${apiBase()}/conversations/${encodeURIComponent(state.conversationId)}`, {
        method: "PATCH",
        headers: { ...authHeaders(), "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      const json = await res.json();
      if (!res.ok || !json.ok) return alert(JSON.stringify(json));
      await refreshConversations();
    }

    async function deleteConversation() {
      if (!state.conversationId) return alert("先选中会话");
      if (!confirm("删除 " + state.conversationId + " ?")) return;
      const res = await fetch(`${apiBase()}/conversations/${encodeURIComponent(state.conversationId)}`, {
        method: "DELETE",
        headers: authHeaders(),
      });
      const json = await res.json();
      if (!res.ok || !json.ok) return alert(JSON.stringify(json));
      newConversation();
    }

    async function cancelRun() {
      const runId = state.interactionRunId || state.runId;
      if (!runId) return;
      const res = await fetch(`${apiBase()}/runs/${encodeURIComponent(runId)}/cancel`, {
        method: "POST",
        headers: authHeaders(),
      });
      const json = await res.json().catch(() => ({}));
      logSSE("cancel", json, res.ok ? "" : "err");
      if (res.ok) clearActiveRun();
      if (state.abort) state.abort.abort();
    }

    function parseSSEChunk(buffer, onEvent) {
      const parts = buffer.split("\n\n");
      const rest = parts.pop() || "";
      for (const block of parts) {
        let event = "message";
        const dataLines = [];
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
        }
        if (!dataLines.length) continue;
        const raw = dataLines.join("\n");
        let data = raw;
        try { data = JSON.parse(raw); } catch {}
        onEvent(event, data, raw);
      }
      return rest;
    }

    async function sendMessage(opts = {}) {
      const resumeRunId = opts.resumeRunId || null;
      // Allow a parallel POST while a confirmation is open (hide modal → type in composer).
      const parallel = !resumeRunId && state.sending && !!state.activeInteractionId;
      if (state.sending && !parallel) return;
      const query = resumeRunId ? "" : $("query").value.trim();
      if (!resumeRunId && !query) return;

      saveConfig();
      if (!parallel) {
        state.sending = true;
        $("btnSend").disabled = true;
        $("btnCancel").disabled = false;
      }
      state.activeStreams += 1;
      if (!resumeRunId) $("query").value = "";

      let thinking = "";
      let answer = "";
      let lastStreamBubble = null;
      let gotTerminal = false;
      const interactionBubbles = new Map();
      const primaryRunId = state.runId;

      if (resumeRunId) {
        addBubble("sys", "页面刷新 · 自动重连 run=" + resumeRunId);
      } else {
        addBubble("user", query, $("userId").value.trim() || "user");
        if (parallel) {
          addBubble("sys", "并行发送中（用于验证：question 期间新 POST chat-messages）");
        }
      }

      // Stream elements are created lazily. Consecutive events with the same
      // identity reuse the last bubble; a changed identity starts a new one.
      function streamBubble(role, key, tag) {
        if (lastStreamBubble &&
            lastStreamBubble.role === role &&
            lastStreamBubble.key === key) {
          return lastStreamBubble;
        }
        if (role === "thinking") thinking = "";
        if (role === "assistant") answer = "";
        const created = addBubble(role, "", tag);
        lastStreamBubble = { role, key, body: created.body, el: created.el };
        return lastStreamBubble;
      }

      function closeIxModal(opts) {
        $("ixModal").classList.remove("open");
        $("ixModalActions").innerHTML = "";
        // Hiding the modal unlocks the composer so a new chat-messages POST can be sent
        // while the original SSE (and pending question) stays open.
        if (opts && opts.unlockComposer) {
          $("btnSend").disabled = false;
          $("query").focus();
        }
      }

      function disableInteraction(id, note) {
        const ix = interactionBubbles.get(id);
        if (!ix) return;
        ix.el.classList.add("done");
        ix.el.querySelectorAll("button, input").forEach((n) => { n.disabled = true; });
        if (note) {
          const n = document.createElement("div");
          n.className = "body";
          n.style.marginTop = "6px";
          n.style.color = "var(--muted)";
          n.textContent = note;
          ix.el.appendChild(n);
        }
        if (state.activeInteractionId === id) {
          state.activeInteractionId = null;
          state.interactionRunId = null;
          closeIxModal();
        }
      }

      function optionDisplayText(a) {
        const parts = [a.label || String(a.value ?? a.id ?? "?")];
        if (a.description) parts.push("— " + a.description);
        if (a.tag && a.tag.text) parts.push("[" + a.tag.text + "]");
        return parts.join(" ");
      }

      function eventActionLabel(eventName) {
        if (eventName === "connect_account") return "连接账户";
        if (eventName === "create_task") return "创建任务";
        if (eventName === "task_generating") return "任务生成中";
        if (eventName === "task_center_approval") return "去任务中心审批";
        return "";
      }

      function knownAskEvent(eventName) {
        return !!eventActionLabel(eventName);
      }

      async function respondInteraction(interactionId, payload) {
        const runId = state.interactionRunId || state.runId;
        if (!runId || !interactionId) return;
        const body = {
          run_id: runId,
          interaction_id: interactionId,
          conversation_id: state.conversationId || undefined,
          ...payload,
        };
        $("ixModalActions").querySelectorAll("button, input").forEach((n) => { n.disabled = true; });
        try {
          const res = await fetch(
            `${apiBase()}/conversations/messages/respond`,
            {
              method: "POST",
              headers: { ...authHeaders(), "Content-Type": "application/json" },
              body: JSON.stringify(body),
            }
          );
          const json = await res.json().catch(() => ({}));
          logSSE("respond", json, res.ok ? "" : "err");
          if (!res.ok || json.ok === false) {
            addBubble("sys", "respond failed: " + (json.error || res.status));
            $("ixModalActions").querySelectorAll("button, input").forEach((n) => { n.disabled = false; });
            return;
          }
          disableInteraction(interactionId, "responded · " + JSON.stringify(body));
        } catch (e) {
          logSSE("respond_error", e.message, "err");
          addBubble("sys", e.message);
          $("ixModalActions").querySelectorAll("button, input").forEach((n) => { n.disabled = false; });
        }
      }

      function showIxModal(kind, data) {
        const id = String(data.interaction_id || "");
        if (!id) return;
        state.activeInteractionId = id;
        state.interactionRunId = data.run_id || state.runId || null;
        const isQuestion = kind === "question_request";
        $("ixModalTitle").textContent = isQuestion ? "问答确认" : "权限确认";
        const meta = [];
        if (data.run_id) meta.push("run=" + data.run_id);
        if (id) meta.push("ix=" + id);
        if (data.expires_at) {
          const left = Math.max(0, Number(data.expires_at) - Math.floor(Date.now() / 1000));
          meta.push("expires_in=" + left + "s");
        }
        if (isQuestion) meta.push("可点「隐藏」后用底部输入框发新消息验证");
        $("ixModalMeta").textContent = meta.join(" · ");

        const card = Array.isArray(data.card_group) && data.card_group[0] ? data.card_group[0] : null;
        const promptText = card
          ? [card.title, card.description].filter(Boolean).join("\n")
          : (data.prompt || "");
        $("ixModalPrompt").textContent = promptText;

        const actionsEl = $("ixModalActions");
        actionsEl.innerHTML = "";
        let actions = [];
        let multiSelect = false;
        if (card && Array.isArray(card.options)) {
          multiSelect = card.type === "multi_select";
          actions = card.options.map((o) => ({
            id: o.value,
            label: o.label || String(o.value),
            value: o.value,
            description: o.description || "",
            tag: o.tag || null,
          }));
        } else if (Array.isArray(data.actions)) {
          // permission_request still uses actions
          actions = data.actions;
        }
        const allowCustom = !!(card && card.others && card.others.custom_input && card.others.custom_input.enabled);

        if (isQuestion && knownAskEvent(data.event)) {
          const eventLine = document.createElement("div");
          eventLine.className = "body";
          eventLine.style.margin = "0 0 10px 0";
          eventLine.style.color = "var(--muted)";
          const label = eventActionLabel(data.event);
          eventLine.textContent = "event=" + data.event + (label ? " · " + label : "");
          actionsEl.appendChild(eventLine);
        }

        if (isQuestion) {
          const choiceInputs = [];
          let firstChoice = null;
          let customChoice = null;
          let input = null;
          const list = document.createElement("div");
          list.style.cssText = "display:flex;flex-direction:column;gap:8px;width:100%;margin-bottom:8px;";

          actions.forEach((a, idx) => {
            const label = document.createElement("label");
            label.style.cssText = "display:flex;align-items:flex-start;gap:8px;cursor:pointer;";
            const choice = document.createElement("input");
            choice.type = multiSelect ? "checkbox" : "radio";
            choice.name = "ix-choice-" + id;
            choice.dataset.kind = "option";
            choice.value = String(idx);
            if (!firstChoice) firstChoice = choice;
            choiceInputs.push(choice);
            const span = document.createElement("span");
            span.textContent = optionDisplayText(a);
            label.appendChild(choice);
            label.appendChild(span);
            list.appendChild(label);
          });

          // allow_custom_input: treat free text as another radio/checkbox option;
          // committed answer value is whatever the user typed (via custom_input).
          if (allowCustom || !actions.length) {
            const customRow = document.createElement("label");
            customRow.style.cssText = "display:flex;align-items:flex-start;gap:8px;cursor:pointer;width:100%;";
            customChoice = document.createElement("input");
            customChoice.type = multiSelect ? "checkbox" : "radio";
            customChoice.name = "ix-choice-" + id;
            customChoice.dataset.kind = "custom";
            customChoice.value = "__custom__";
            if (!firstChoice) firstChoice = customChoice;
            choiceInputs.push(customChoice);
            const customBody = document.createElement("div");
            customBody.style.cssText = "flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;";
            const customLabel = document.createElement("span");
            customLabel.textContent = actions.length ? "其他…自己输入" : "请输入回答";
            input = document.createElement("input");
            input.className = "ix-free";
            input.type = "text";
            input.placeholder = actions.length ? "输入自定义内容" : "请输入回答";
            input.style.cssText = "width:100%;padding:8px;box-sizing:border-box;";
            input.disabled = !!actions.length; // enable when custom option is selected
            customBody.appendChild(customLabel);
            customBody.appendChild(input);
            customRow.appendChild(customChoice);
            customRow.appendChild(customBody);
            list.appendChild(customRow);

            const syncCustomEnabled = () => {
              const on = !!customChoice.checked;
              input.disabled = !on && !!actions.length;
              if (on) input.focus();
            };
            customChoice.addEventListener("change", syncCustomEnabled);
            // Selecting a preset radio clears custom focus state for single-select.
            choiceInputs.forEach((c) => {
              if (c === customChoice) return;
              c.addEventListener("change", () => {
                if (!multiSelect) syncCustomEnabled();
              });
            });
            input.addEventListener("focus", () => {
              if (!customChoice.checked) {
                customChoice.checked = true;
                syncCustomEnabled();
              }
            });
          }

          if (actions.length || allowCustom) {
            actionsEl.appendChild(list);
          }

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "primary";
          btn.textContent = "Commit";
          const commit = () => {
            const customOn = customChoice && customChoice.checked;
            const customInput = input ? input.value.trim() : "";
            if (customOn) {
              if (!customInput) return;
              // Free-text answer: API field is custom_input; payload value is the typed text.
              respondInteraction(id, { answers: [{ index: 0, custom_input: customInput }] });
              return;
            }
            const selected = choiceInputs
              .filter((choice) => choice.checked && choice.dataset.kind === "option")
              .map((choice) => actions[Number(choice.value)])
              .filter(Boolean)
              .map((a) => a.value !== undefined ? a.value : a.id);
            if (!selected.length) return;
            respondInteraction(id, {
              answers: [{ index: 0, value: multiSelect ? selected : selected[0] }],
            });
          };
          btn.addEventListener("click", commit);
          if (input) {
            input.addEventListener("keydown", (e) => {
              if (e.isComposing || e.keyCode === 229) return;
              if (e.key === "Enter") {
                e.preventDefault();
                commit();
              }
            });
          }
          actionsEl.appendChild(btn);
          setTimeout(() => (firstChoice || btn).focus(), 0);
        } else if (actions.length) {
          for (const a of actions) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = optionDisplayText(a);
            const decision = String(a.id || "");
            if (decision === "allow" || decision === "allow_all") btn.className = "primary";
            if (decision === "deny") btn.className = "danger";
            btn.addEventListener("click", () => respondInteraction(id, { decision: a.id }));
            actionsEl.appendChild(btn);
          }
        }

        $("ixModal").classList.add("open");
      }

      function renderInteraction(kind, data) {
        const id = String(data.interaction_id || "");
        if (!id) return;
        const isQuestion = kind === "question_request";
        const tag = isQuestion ? "question" : "permission";
        const bubble = streamBubble("interaction", id, tag);
        interactionBubbles.set(id, bubble);
        bubble.body.textContent = (Array.isArray(data.card_group) && data.card_group[0] && data.card_group[0].title)
          ? data.card_group[0].title
          : (data.prompt || "");
        bubble.el.querySelectorAll(".ix-actions, .ix-free").forEach((n) => n.remove());
        const hint = document.createElement("div");
        hint.className = "body";
        hint.style.marginTop = "6px";
        hint.style.color = "var(--muted)";
        hint.textContent = isQuestion ? "请在弹窗中回答" : "请在弹窗中选择";
        bubble.el.appendChild(hint);
        if (data.expires_at) {
          const exp = document.createElement("div");
          exp.className = "body";
          exp.style.marginTop = "4px";
          exp.style.color = "var(--muted)";
          exp.textContent = "expires_at=" + data.expires_at;
          bubble.el.appendChild(exp);
        }
        $("messages").scrollTop = $("messages").scrollHeight;
        showIxModal(kind, data);
      }

      const body = resumeRunId
        ? { run_id: resumeRunId }
        : {
            query,
            auto_generate_name: true,
            metadata: { source: "chat-api-debug-ui" },
          };
      if (!resumeRunId && state.conversationId) body.conversation_id = state.conversationId;

      const controller = new AbortController();
      state.abort = controller;

      try {
        const res = await fetch(`${apiBase()}/chat-messages`, {
          method: "POST",
          headers: {
            ...authHeaders(),
            "Content-Type": "application/json",
            Accept: "text/event-stream",
          },
          body: JSON.stringify(body),
          signal: controller.signal,
        });

        if (!res.ok) {
          const text = await res.text();
          logSSE("http_error", text, "err");
          addBubble("sys", `HTTP ${res.status}: ${text}`);
          if (resumeRunId && res.status === 404) {
            clearActiveRun();
          } else if (resumeRunId && res.status === 409) {
            addBubble("sys", "run 仍占用中，2s 后重试重连…");
            setTimeout(() => {
              if (state.runId === resumeRunId && !state.sending) {
                resumeActiveRun().catch(console.error);
              }
            }, 2000);
          }
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          buf = parseSSEChunk(buf, (event, data) => {
            logSSE(event, data, event === "error" ? "err" : event === "message_queued" || event === "ping" ? "warn" : "");
            if (event === "message") {
              if (data.conversation_id) {
                state.conversationId = data.conversation_id;
                setConvLabel();
                saveConfig();
              }
              if (data.run_id) {
                // Keep the run that owns an open interaction for respond/cancel.
                if (!state.activeInteractionId || !state.runId || !parallel) {
                  setActiveRun(data.run_id);
                }
              }
            } else if (event === "thinking_delta") {
              // Ensure bubble exists first — streamBubble resets thinking when creating a new one.
              const thinkingBubble = streamBubble("thinking", "thinking", "thinking");
              if (data.replace) thinking = data.text || "";
              else thinking += data.text || "";
              thinkingBubble.body.textContent = thinking;
              $("messages").scrollTop = $("messages").scrollHeight;
            } else if (event === "tool_call") {
              const id = String(data.tool_call_id || "unknown");
              const toolBubble = streamBubble("tool", id, "tool #" + id);
              const lines = ["call · " + (data.name || "?")];
              if (data.input) lines.push(data.input);
              toolBubble.body.textContent = lines.join("\n");
              $("messages").scrollTop = $("messages").scrollHeight;
            } else if (event === "tool_result") {
              const id = String(data.tool_call_id || "unknown");
              const toolBubble = streamBubble("tool", id, "tool #" + id);
              const prev = toolBubble.body.textContent ? toolBubble.body.textContent + "\n" : "";
              const meta = [];
              if (data.status) meta.push("status=" + data.status);
              if (data.exit_code !== undefined && data.exit_code !== null) meta.push("exit=" + data.exit_code);
              if (data.success !== undefined && data.success !== null) meta.push("ok=" + data.success);
              const lines = ["result" + (meta.length ? " · " + meta.join(" ") : "")];
              if (data.output) lines.push(data.output);
              toolBubble.body.textContent = prev + lines.join("\n");
              $("messages").scrollTop = $("messages").scrollHeight;
            } else if (event === "text_delta") {
              // Ensure bubble exists first — streamBubble resets answer when creating a new one.
              const answerBubble = streamBubble("assistant", "assistant", "assistant");
              if (data.replace) answer = data.text || "";
              else answer += data.text || "";
              answerBubble.body.textContent = answer;
              $("messages").scrollTop = $("messages").scrollHeight;
            } else if (event === "permission_request" || event === "question_request") {
              renderInteraction(event, data);
            } else if (event === "interaction_superseded") {
              disableInteraction(String(data.interaction_id || ""), "superseded → " + (data.replacement_id || "?"));
            } else if (event === "interaction_ack") {
              disableInteraction(String(data.interaction_id || ""), data.text || "ack");
            } else if (event === "ping") {
              // keepalive only — already logged
            } else if (event === "message_queued") {
              gotTerminal = true;
              addBubble("sys", `queued (depth=${data.queue_depth ?? "?"})`);
            } else if (event === "error") {
              gotTerminal = true;
              const kind = data.kind ? ` kind=${data.kind}` : "";
              addBubble("sys", "error: " + (data.error || JSON.stringify(data)) + kind);
              if (!parallel) {
                state.activeInteractionId = null;
                state.interactionRunId = null;
                closeIxModal();
              }
            } else if (event === "message_end") {
              gotTerminal = true;
              if (!parallel) {
                state.activeInteractionId = null;
                state.interactionRunId = null;
                closeIxModal();
              }
              if (!answer && data.answer) {
                const answerBubble = streamBubble("assistant", "assistant", "assistant");
                answer = data.answer;
                answerBubble.body.textContent = answer;
              }
            }
          });
        }
      } catch (e) {
        if (e.name !== "AbortError") {
          logSSE("client_error", e.message, "err");
          addBubble("sys", e.message);
        } else if (!gotTerminal) {
          // Page refresh / network abort: keep activeRunId for auto-resume.
          logSSE("detached", "SSE aborted; run kept for resume", "warn");
        }
      } finally {
        state.activeStreams = Math.max(0, state.activeStreams - 1);
        if (!parallel) {
          state.sending = false;
          state.abort = null;
          if (gotTerminal) {
            clearActiveRun();
          } else if (state.activeInteractionId && primaryRunId) {
            state.runId = primaryRunId;
            saveConfig();
          }
          $("btnSend").disabled = false;
          $("btnCancel").disabled = !state.runId && !state.interactionRunId;
        }
        setConvLabel();
        refreshConversations().catch(() => {});
      }
    }

    async function resumeActiveRun() {
      const runId = state.runId;
      if (!runId) return;
      await sendMessage({ resumeRunId: runId });
    }

    $("btnSave").addEventListener("click", () => { saveConfig(); ping(); });
    $("btnHealth").addEventListener("click", ping);
    $("btnRefresh").addEventListener("click", () => refreshConversations().catch(console.error));
    $("btnNew").addEventListener("click", newConversation);
    $("btnRename").addEventListener("click", () => renameConversation().catch(console.error));
    $("btnDelete").addEventListener("click", () => deleteConversation().catch(console.error));
    $("btnSend").addEventListener("click", () => sendMessage().catch(console.error));
    $("btnCancel").addEventListener("click", () => cancelRun().catch(console.error));
    $("btnIxClose").addEventListener("click", () => {
      // hideIxModalForNewMessage is defined inside sendMessage; provide a top-level hide.
      if (!$("ixModal").classList.contains("open")) return;
      addBubble("sys", "已隐藏确认窗口 · 可在底部输入框发新消息验证（原 SSE 仍打开）");
      $("ixModal").classList.remove("open");
      $("ixModalActions").innerHTML = "";
      $("btnSend").disabled = false;
      $("query").focus();
    });
    $("btnClearLog").addEventListener("click", () => { $("sseLog").innerHTML = ""; });
    $("query").addEventListener("keydown", (e) => {
      // IME 组字确认（选词/回车确认）时不要当成发送。
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage().catch(console.error);
      }
    });

    loadConfig();
    setConvLabel();
    ping().then((ok) => {
      if (ok) return refreshConversations();
    }).then(() => {
      if (state.conversationId) return openConversation(state.conversationId);
    }).then(() => {
      if (state.runId) return resumeActiveRun();
    }).catch(console.error);
  </script>
</body>
</html>
